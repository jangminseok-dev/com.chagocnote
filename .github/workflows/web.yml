# 보호자 알림장 웹 — 컴포넌트·단위(Vitest)·빌드와 형 검사·서버 응답 검사.
# e2e 는 개발 스택이 떠 있어야 해서 로컬에서만 돈다(_docs/harness.md).
name: web

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# 같은 브랜치에 새로 푸시하면 앞선 실행을 취소한다 — 무료 분을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 web/package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      # Node 는 compose 의 web(node:24-alpine)과 같은 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 컴포넌트·단위
        run: pnpm test
      - name: 빌드·형 검사
        run: pnpm build
      - name: 서버 응답 검사
        run: pnpm check:server
